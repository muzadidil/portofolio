<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light">
    <title>Admin · Portofolio Fuad</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="assets/css/style.css">
    <script type="module" src="assets/js/admin.js"></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="./">
            <span class="brand__mark" aria-hidden="true">F</span>
            <span class="brand__name"><span id="brand">Portofolio Fuad</span> <span class="brand__badge">Admin</span></span>
        </a>

        <div class="admin-links">
            <a class="button" href="./">Lihat situs</a>
            <button type="button" class="button" id="logout">Keluar</button>
        </div>
    </header>

    <main class="admin" id="admin">
        <p class="summary" id="status">Memeriksa login…</p>

        <div class="toolbar" id="toolbar" hidden>
            <label class="search">
                <span class="sr-only">Cari proyek</span>
                <input type="search" id="search" placeholder="Cari proyek…" autocomplete="off">
            </label>
            <button type="button" class="button" id="backup" title="Simpan salinan semua proyek sebagai berkas JSON">Cadangkan</button>

            <label class="button" title="Masukkan lagi proyek dari berkas cadangan">
                Pulihkan
                <input type="file" id="restore" accept="application/json,.json" class="sr-only">
            </label>

            <button type="button" class="button" id="openGithub">Ambil dari GitHub</button>
            <button type="button" class="button button--primary" id="add">+ Tambah proyek</button>
        </div>

        <ul class="projects projects--admin" id="list"></ul>
    </main>

    <!-- Formulir tambah / ubah proyek -->
    <dialog class="dialog" id="editor">
        <form method="dialog" class="form" id="editorForm">
            <h2 class="dialog__title" id="editorTitle">Tambah proyek</h2>

            <label class="field">
                <span>Nama proyek *</span>
                <input name="name" required maxlength="120" autocomplete="off">
            </label>

            <label class="field">
                <span>Kategori</span>
                <input name="categories" list="categoryList" autocomplete="off" placeholder="mis. next js, firestore">
                <small>Pisahkan dengan koma. Satu proyek boleh punya beberapa kategori.</small>
            </label>
            <datalist id="categoryList"></datalist>

            <label class="field">
                <span>Deskripsi</span>
                <textarea name="description" rows="4" maxlength="2000"></textarea>
            </label>

            <label class="field">
                <span>Link tujuan</span>
                <input name="github" type="text" inputmode="url" placeholder="https://github.com/…">
                <small>Repo GitHub, atau alamat lain tempat proyeknya berada.</small>
            </label>

            <label class="field">
                <span>Link preview</span>
                <input name="demo" type="text" inputmode="url" placeholder="https://…">
                <small>Situs atau aplikasi yang bisa langsung dicoba.</small>
            </label>

            <div class="field-row">
                <label class="field">
                    <span>Tahun</span>
                    <input name="year" type="number" min="1990" max="2100" inputmode="numeric">
                </label>

                <label class="field">
                    <span>Status</span>
                    <select name="status">
                        <option value="selesai">Selesai</option>
                        <option value="berjalan">Berjalan</option>
                    </select>
                </label>
            </div>

            <p class="form__error" id="editorError" role="alert"></p>

            <div class="dialog__actions">
                <button type="button" class="button" value="cancel" id="editorCancel">Batal</button>
                <button type="submit" class="button button--primary" id="editorSave">Simpan</button>
            </div>
        </form>
    </dialog>

    <!-- Ambil repo dari GitHub -->
    <dialog class="dialog dialog--wide" id="github">
        <div class="form">
            <h2 class="dialog__title">Ambil dari GitHub</h2>
            <p class="muted" id="githubStatus">Memuat repo…</p>
            <ul class="repos" id="repos"></ul>

            <div class="dialog__actions">
                <button type="button" class="button" id="githubCancel">Batal</button>
                <button type="button" class="button button--primary" id="githubAdd" disabled>Tambahkan</button>
            </div>
        </div>
    </dialog>
</body>
</html>
